name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: steammate
          POSTGRES_PASSWORD: steammate
          POSTGRES_DB: steammate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steammate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI 전용 더미 값. 실제 키는 사용하지 않는다(외부 API는 테스트에서 모킹).
      DATABASE_URL: postgresql+asyncpg://steammate:steammate@localhost:5432/steammate_test
      TEST_DATABASE_URL: postgresql+asyncpg://steammate:steammate@localhost:5432/steammate_test
      STEAM_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Migrations up/down
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Test
        run: pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
